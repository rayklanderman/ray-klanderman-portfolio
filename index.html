<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfaf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10231C" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="Raymond Klanderman" />
    <script>
      // Apply a saved colour theme before first paint (light is the default).
      (function () {
        try {
          var t = localStorage.getItem('colorTheme');
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
