name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:run

      # Includes the SSR build and prerender of every route, so a broken page fails CI.
      - name: Production build
        run: npm run build

      - name: Check prerendered output
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/sitemap.xml
          grep -q 'data-prerendered-path="/"' dist/index.html
          ls dist/projects/*/index.html
